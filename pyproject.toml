[project]
name = "kairos"
version = "0.2.0"
description = "Kairos - 期货交易技术分析和决策系统"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Kairos Team", email = "kairos@example.com"},
]
keywords = ["futures", "trading", "technical-analysis", "quantitative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "akshare>=1.14.0",
    "dash>=3.3.0",
    "pandas>=2.0.0",
    "platformdirs>=4.0.0",
    "plotly>=5.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.5",
]

[project.scripts]
kairos = "kairos.cli:main"
kairos-analyze = "kairos.cli:analyze"
kairos-update = "kairos.cli:update_contracts"
kairos-web = "kairos.cli:run_web"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kairos"]

[tool.hatch.build.targets.sdist]
include = ["src/kairos"]

